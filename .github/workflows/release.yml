name: Release & Snapshot Builds (26.3)

on:
  push:
    branches:
      - '26.3'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or update branch snapshot
        if: github.ref == 'refs/heads/26.3'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          recreateRelease: true
          prerelease: true
          commit: ${{ github.sha }}
          tag: "latest-26.3"
          name: "DecorBlock (26.3) - Snapshot"
          body: |
            Automatic snapshot for branch 26.3.
            Built from commit ${{ github.sha }}.
          artifacts: "build/libs/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove legacy snapshot release
        if: github.ref == 'refs/heads/26.3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly-26.3 >/dev/null 2>&1; then
            gh release delete nightly-26.3 --cleanup-tag --yes
          fi
